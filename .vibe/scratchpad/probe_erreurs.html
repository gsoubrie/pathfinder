	<script>
		function PROBE_openRacePopup() {
			MANAGER.EventManagerV2.doActionAfter(
				{ target: document.querySelector( ".grid-area.area-race input" ), button: 0, stopPropagation: function () {} },
				"event__property_popup__open",
				{ "property_name": "race" }
			);
		}

		function PROBE_openClassPopup() {
			MANAGER.EventManagerV2.doActionAfter(
				{ target: document.querySelector( ".grid-area.area-class .class-add-button" ), button: 0, stopPropagation: function () {} },
				"event__property_popup__open",
				{ "property_name": "class" }
			);
		}

		window.addEventListener( "load", function () {
			let out = document.getElementById( "probe-out" );
			let log = function ( txt ) {
				let div = document.createElement( "div" );
				div.innerText = txt;
				out.appendChild( div );
			};

			// crochet : trace toute mise a jour non nulle d'un compteur errors
			let _update_originale = GS.OBJECT.CounterV2.prototype.update;
			GS.OBJECT.CounterV2.prototype.update = function ( name, nb_counter, tooltip, retry_update_html, is_force ) {
				if ( this.type === "errors" && nb_counter ) {
					log( "ERROR-COUNTER SET name=" + name + " nb=" + nb_counter );
					log( "STACK " + ( new Error().stack || "" ).split( "\n" ).slice( 1, 6 ).join( " || " ) );
				}
				return _update_originale.call( this, name, nb_counter, tooltip, retry_update_html, is_force );
			};

			TEST.RESET.sheet();
			PROBE_openRacePopup();
			TEST.clickTab( "body > .popup", "Elfe" ).then( function () {
				CONTROLLER.Character.doActionAfter( "event__form__element_changed" );
				return TEST.clickTab( ".character-sheet-windows", CHARACTER.CharacteristicWindow.NAME );
			} ).then( function () {
				let _pane = document.querySelector( ".gs-tab-pane[data-name='" + CHARACTER.CharacteristicWindow.NAME + "']" );
				let _characteristics = CONTROLLER.Character.current_character.getCharacteristics();

				// sequence utilisateur : moins sur cellules vides (TO_EDIT) et forcees (FORCED)
				let _targets = ["FOR", "DEX", "SAG"];
				for ( let i = 0; i < _targets.length; i++ ) {
					let _less = _pane.querySelector( ".characteristic-line[data-name='" + _targets[ i ] + "'] .characteristic-bonus-race [data-name='event__less_button']" );
					if ( _less ) {
						_less.click();
						log( "CLIC - sur " + _targets[ i ] + " : free_number=" + _characteristics.getRaceBonus().bonus.getFreeNumber() );
					}
				}
				// moins sur la colonne classe (SLEEPING)
				let _class_less = _pane.querySelector( ".characteristic-line[data-name='FOR'] .characteristic-bonus-class [data-name='event__less_button']" );
				if ( _class_less ) {
					_class_less.click();
					log( "CLIC - sur bonus classe FOR : class free_number=" + _characteristics.getClassBonus().bonus.getFreeNumber() );
				}
				// moins sur la valeur initiale
				let _init_less = _pane.querySelector( ".characteristic-line[data-name='FOR'] .characteristic-initial-value [data-name='event__less_button']" );
				if ( _init_less ) {
					_init_less.click();
					log( "CLIC - sur valeur initiale FOR : initial=" + _characteristics.getContentByUUID( "FOR" ).initial_value.value );
				}
				let _tab = document.querySelector( ".character-sheet-windows .gs-window-element-V2[data-name='" + CHARACTER.CharacteristicWindow.NAME + "']" );
				log( "TAB errors = " + ( _tab ? _tab.querySelector( ".gs-errors-counter" ).getAttribute( "data-number" ) : "?" ) );
				log( "TAB warnings = " + ( _tab ? _tab.querySelector( ".gs-warnings-counter" ).getAttribute( "data-number" ) : "?" ) );
				log( "PROBE-DONE" );
			} );
		} );
	</script>
