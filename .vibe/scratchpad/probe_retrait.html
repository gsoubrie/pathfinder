	<script>
		function PROBE_openRacePopup() {
			MANAGER.EventManagerV2.doActionAfter(
				{ target: document.querySelector( ".grid-area.area-race input" ), button: 0, stopPropagation: function () {} },
				"event__property_popup__open",
				{ "property_name": "race" }
			);
		}

		window.addEventListener( "load", function () {
			let out = document.getElementById( "probe-out" );
			let log = function ( txt ) {
				let div = document.createElement( "div" );
				div.innerText = txt;
				out.appendChild( div );
			};

			let _update_originale = GS.OBJECT.CounterV2.prototype.update;
			GS.OBJECT.CounterV2.prototype.update = function ( name, nb_counter, tooltip, retry_update_html, is_force ) {
				if ( this.type === "errors" && nb_counter ) {
					log( "ERROR-COUNTER SET name=" + name + " nb=" + nb_counter );
					log( "STACK " + ( new Error().stack || "" ).split( "\n" ).slice( 1, 7 ).join( " || " ) );
				}
				return _update_originale.call( this, name, nb_counter, tooltip, retry_update_html, is_force );
			};

			TEST.RESET.sheet();
			PROBE_openRacePopup();
			TEST.clickTab( "body > .popup", "Humain" ).then( function () {
				CONTROLLER.Character.doActionAfter( "event__form__element_changed" );
				return TEST.clickTab( ".character-sheet-windows", CHARACTER.CharacteristicWindow.NAME );
			} ).then( function () {
				let _pane = document.querySelector( ".gs-tab-pane[data-name='" + CHARACTER.CharacteristicWindow.NAME + "']" );
				let _characteristics = CONTROLLER.Character.current_character.getCharacteristics();

				let _for_more = _pane.querySelector( ".characteristic-line[data-name='FOR'] .characteristic-bonus-race [data-name='event__more_button']" );
				let _dex_more = _pane.querySelector( ".characteristic-line[data-name='DEX'] .characteristic-bonus-race [data-name='event__more_button']" );
				_for_more.click();
				_dex_more.click();
				log( "POSE : FOR=" + _characteristics.getContentByUUID( "FOR" ).race_bonus.getValue()
					+ " DEX=" + _characteristics.getContentByUUID( "DEX" ).race_bonus.getValue()
					+ " free_number=" + _characteristics.getRaceBonus().bonus.getFreeNumber() );

				let _for_less = _pane.querySelector( ".characteristic-line[data-name='FOR'] .characteristic-bonus-race [data-name='event__less_button']" );
				let _dex_less = _pane.querySelector( ".characteristic-line[data-name='DEX'] .characteristic-bonus-race [data-name='event__less_button']" );
				_for_less.click();
				log( "RETRAIT FOR : valeur=" + _characteristics.getContentByUUID( "FOR" ).race_bonus.getValue()
					+ " phase=" + _characteristics.getContentByUUID( "FOR" ).race_bonus.getCurrentPhase()
					+ " free_number=" + _characteristics.getRaceBonus().bonus.getFreeNumber() );
				_dex_less.click();
				log( "RETRAIT DEX : valeur=" + _characteristics.getContentByUUID( "DEX" ).race_bonus.getValue()
					+ " phase=" + _characteristics.getContentByUUID( "DEX" ).race_bonus.getCurrentPhase()
					+ " free_number=" + _characteristics.getRaceBonus().bonus.getFreeNumber() );

				setTimeout( function () {
					let _tab = document.querySelector( ".character-sheet-windows .gs-window-element-V2[data-name='" + CHARACTER.CharacteristicWindow.NAME + "']" );
					log( "TAB errors = [" + ( _tab ? _tab.querySelector( ".gs-errors-counter" ).getAttribute( "data-number" ) : "?" ) + "]" );
					log( "TAB warnings = [" + ( _tab ? _tab.querySelector( ".gs-warnings-counter" ).getAttribute( "data-number" ) : "?" ) + "]" );
					let _badge = _tab ? _tab.querySelector( ".characteristic-warning-badge" ) : null;
					log( "BADGE = [" + ( _badge ? _badge.textContent : "absent" ) + "]" );
					let _all_errors = document.querySelectorAll( ".gs-errors-counter" );
					log( "NB ERRORS-COUNTERS DANS LE DOM = " + _all_errors.length );
					for ( let i = 0; i < _all_errors.length; i++ ) {
						log( "ERRORS-DOM[" + i + "] data-number=[" + _all_errors[ i ].getAttribute( "data-number" ) + "] html=" + _all_errors[ i ].outerHTML );
					}
					log( "PROBE-DONE" );
				}, 500 );
			} );
		} );
	</script>
