	<script>
		function PROBE_openRacePopup() {
			MANAGER.EventManagerV2.doActionAfter(
				{ target: document.querySelector( ".grid-area.area-race input" ), button: 0, stopPropagation: function () {} },
				"event__property_popup__open",
				{ "property_name": "race" }
			);
		}

		function PROBE_dumpCounter( label, counter ) {
			if ( !counter ) {
				return label + " = ABSENT";
			}
			return label + " = valeur:" + counter.getValue()
				+ " mapping:" + JSON.stringify( counter._elements_mapping );
		}

		window.addEventListener( "load", function () {
			let out = document.getElementById( "probe-out" );
			let log = function ( txt ) {
				let div = document.createElement( "div" );
				div.innerText = txt;
				out.appendChild( div );
			};

			TEST.RESET.sheet();
			PROBE_openRacePopup();
			TEST.clickTab( "body > .popup", "Elfe" ).then( function () {
				CONTROLLER.Character.doActionAfter( "event__form__element_changed" );
				return TEST.clickTab( ".character-sheet-windows", CHARACTER.CharacteristicWindow.NAME );
			} ).then( function () {
				let _pane = document.querySelector( ".gs-tab-pane[data-name='" + CHARACTER.CharacteristicWindow.NAME + "']" );
				let _character = CONTROLLER.Character.current_character;
				let _characteristics = _character.getCharacteristics();

				let _dex_less = _pane.querySelector( ".characteristic-line[data-name='DEX'] .characteristic-bonus-race [data-name='event__less_button']" );
				log( "AVANT CLIC - SUR DEX (force)" );
				let _char_window = _character.windows.getContentByUUID( CHARACTER.CharacteristicWindow.NAME );
				log( PROBE_dumpCounter( "WINDOW errors", _char_window && _char_window.getCounter ? _char_window.getCounter( "errors" ) : null ) );
				log( PROBE_dumpCounter( "WINDOW warnings", _char_window && _char_window.getCounter ? _char_window.getCounter( "warnings" ) : null ) );
				log( PROBE_dumpCounter( "CHARACTERISTICS errors", _characteristics.getCounter( "errors" ) ) );
				log( PROBE_dumpCounter( "CHARACTERISTICS warnings", _characteristics.getCounter( "warnings" ) ) );
				log( PROBE_dumpCounter( "RACE_BONUS errors", _characteristics.getRaceBonus().getCounter( "errors" ) ) );
				log( PROBE_dumpCounter( "RACE_BONUS warnings", _characteristics.getRaceBonus().getCounter( "warnings" ) ) );

				if ( _dex_less ) {
					_dex_less.click();
					log( "APRES CLIC - SUR DEX : valeur=" + _characteristics.getContentByUUID( "DEX" ).race_bonus.getValue() );
					log( PROBE_dumpCounter( "WINDOW errors", _char_window && _char_window.getCounter ? _char_window.getCounter( "errors" ) : null ) );
					log( PROBE_dumpCounter( "WINDOW warnings", _char_window && _char_window.getCounter ? _char_window.getCounter( "warnings" ) : null ) );
					log( PROBE_dumpCounter( "CHARACTERISTICS errors", _characteristics.getCounter( "errors" ) ) );
					log( PROBE_dumpCounter( "CHARACTERISTICS warnings", _characteristics.getCounter( "warnings" ) ) );
					log( PROBE_dumpCounter( "RACE_BONUS errors", _characteristics.getRaceBonus().getCounter( "errors" ) ) );
					log( PROBE_dumpCounter( "RACE_BONUS warnings", _characteristics.getRaceBonus().getCounter( "warnings" ) ) );

					// DOM de l'onglet
					let _tab = document.querySelector( ".character-sheet-windows .gs-window-element-V2[data-name='" + CHARACTER.CharacteristicWindow.NAME + "']" );
					let _tab_errors = _tab ? _tab.querySelector( ".gs-errors-counter" ) : null;
					let _tab_warnings = _tab ? _tab.querySelector( ".gs-warnings-counter" ) : null;
					log( "TAB errors dom = " + ( _tab_errors ? _tab_errors.outerHTML : "ABSENT" ) );
					log( "TAB warnings dom = " + ( _tab_warnings ? _tab_warnings.outerHTML : "ABSENT" ) );
				}
				log( "PROBE-DONE" );
			} );
		} );
	</script>
