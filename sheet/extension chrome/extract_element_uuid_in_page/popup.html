<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extract Element UUID</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      font-family: 'Georgia', serif;
      background: #1a0f00;
      color: #e8d5b0;
    }

    .header {
      background: linear-gradient(135deg, #3d1a00, #1a0f00);
      border-bottom: 2px solid #8b4513;
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .rune { font-size: 26px; filter: drop-shadow(0 0 6px #ff6600aa); }
    .header-text h1 { font-size: 13px; font-weight: bold; color: #f0c060; letter-spacing: .08em; text-transform: uppercase; }
    .header-text p  { font-size: 10px; color: #a0825a; margin-top: 2px; }

    .content { padding: 14px 16px; }

    /* ── Zones ── */
    .section { margin-bottom: 12px; }
    .section-title {
      font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
      color: #806040; margin-bottom: 6px;
    }

    /* ── Drop zone ── */
    .drop-zone {
      border: 2px dashed #3d2200;
      border-radius: 4px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      font-size: 11px;
      color: #806040;
      transition: border-color .15s, background .15s;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #8b4513;
      background: #0d0800;
      color: #c8a870;
    }
    .drop-zone.loaded {
      border-color: #4caf50;
      color: #4caf50;
    }

    /* ── Status ── */
    .status-bar {
      background: #0d0800;
      border: 1px solid #3d2200;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 11px;
      color: #c8a870;
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #555; flex-shrink: 0; }
    .status-bar.ok    .dot { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
    .status-bar.error .dot { background: #e53935; box-shadow: 0 0 6px #e53935; }
    .status-bar.info  .dot { background: #ff9800; box-shadow: 0 0 6px #ff9800; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Progress ── */
    .progress-wrap {
      display: none;
      margin-bottom: 12px;
    }
    .progress-wrap.visible { display: block; }
    .progress-bar-bg {
      background: #0d0800;
      border: 1px solid #3d2200;
      border-radius: 4px;
      height: 12px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #8b2500, #f0c060);
      width: 0%;
      transition: width .3s;
    }
    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #806040;
    }

    /* ── Current item ── */
    .current-item {
      font-size: 10px;
      color: #a0825a;
      background: #0d0800;
      border: 1px solid #3d2200;
      border-radius: 4px;
      padding: 6px 10px;
      margin-bottom: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: none;
    }
    .current-item.visible { display: block; }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-family: 'Georgia', serif;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .06em;
      transition: all .15s;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #8b2500, #5c1800);
      color: #f0c060;
      border: 1px solid #aa3300;
    }
    .btn-primary:hover:not(:disabled) { background: linear-gradient(135deg, #aa3000, #6e1e00); box-shadow: 0 0 12px #aa330066; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      color: #a0825a;
      border: 1px solid #3d2200;
      font-size: 11px;
      padding: 7px;
    }
    .btn-secondary:hover:not(:disabled) { border-color: #8b4513; color: #c8a870; }
    .btn-secondary:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Stats résumé ── */
    .stats {
      display: flex;
      justify-content: space-around;
      background: #0d0800;
      border: 1px solid #3d2200;
      border-radius: 4px;
      padding: 8px;
      margin-bottom: 8px;
    }
    .stat-item { text-align: center; }
    .stat-value { font-size: 20px; font-weight: bold; color: #f0c060; display: block; line-height: 1; }
    .stat-label { font-size: 9px; color: #806040; text-transform: uppercase; letter-spacing: .05em; }

    .log {
      background: #0d0800;
      border: 1px solid #3d2200;
      border-radius: 4px;
      padding: 8px;
      font-family: 'Courier New', monospace;
      font-size: 9px;
      color: #90c080;
      max-height: 80px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .log::-webkit-scrollbar { width: 4px; }
    .log::-webkit-scrollbar-thumb { background: #3d2200; border-radius: 2px; }
    .log .err { color: #e57373; }

    textarea#json-input {
      width: 100%;
      height: 90px;
      background: #0d0800;
      border: 1px solid #3d2200;
      border-radius: 4px;
      color: #90c080;
      font-family: 'Courier New', monospace;
      font-size: 9px;
      padding: 8px;
      resize: vertical;
      outline: none;
      line-height: 1.5;
    }
    textarea#json-input:focus { border-color: #8b4513; }
    textarea#json-input::placeholder { color: #4d3020; }
  </style>
</head>
<body>

<div class="header">
  <div class="rune">📜</div>
  <div class="header-text">
    <h1>Extract Element UUID</h1>
    <p>Pathfinder 2e · Extraction détaillée</p>
  </div>
</div>

<div class="content">

  <!-- Status -->
  <div class="status-bar" id="status">
    <div class="dot"></div>
    <span id="status-text">Chargez un fichier JSON pour commencer.</span>
  </div>

  <!-- JSON input -->
  <div class="section">
    <div class="section-title">1. Collez votre JSON ici</div>
    <textarea id="json-input" placeholder="{ &quot;id1&quot;: { &quot;href&quot;: &quot;/ancestries/...&quot;, ... }, ... }"></textarea>
    <button class="btn btn-secondary" id="btn-load" style="margin-top:6px">↵ Charger le JSON</button>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
    <div class="progress-labels">
      <span id="progress-text">0 / 0</span>
      <span id="progress-pct">0%</span>
    </div>
  </div>

  <!-- Item en cours -->
  <div class="current-item" id="current-item">—</div>

  <!-- Boutons -->
  <button class="btn btn-primary" id="btn-start" disabled>⚔ Lancer l'extraction</button>
  <button class="btn btn-secondary" id="btn-download" disabled>↓ Télécharger les résultats</button>
  <button class="btn btn-secondary" id="btn-reset" disabled>↺ Réinitialiser</button>

  <!-- Stats finales -->
  <div class="stats" id="stats" style="display:none">
    <div class="stat-item">
      <span class="stat-value" id="stat-ok">0</span>
      <span class="stat-label">Extraits</span>
    </div>
    <div class="stat-item">
      <span class="stat-value" id="stat-err">0</span>
      <span class="stat-label">Erreurs</span>
    </div>
  </div>

  <!-- Log -->
  <div class="log" id="log"></div>

</div>

<script src="popup.js"></script>
</body>
</html>
