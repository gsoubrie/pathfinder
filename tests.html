	<style>
		#test-report {
			position        : fixed;
			top             : 0;
			right           : 0;
			width           : 520px;
			max-height      : 80vh;
			overflow-y      : auto;
			background      : #1e1e1e;
			color           : #d4d4d4;
			font-family     : monospace;
			font-size       : 12px;
			padding         : 8px;
			z-index         : 99999;
			border          : 1px solid #555;
		}
		#test-report .test-report-title {
			display      : flex;
			align-items  : center;
			font-weight  : bold;
			margin       : 4px 0 8px 0;
		}
		#test-report .test-report-close {
			margin-left    : auto;
			cursor         : pointer;
			color          : #d4d4d4;
			background     : #333;
			border         : 1px solid #555;
			border-radius  : 3px;
			padding        : 2px 8px;
			font-size      : 11px;
			font-family    : monospace;
		}
		#test-report .test-report-close:hover {
			background : #444;
		}
		#test-report .test-pass {
			color  : #7ee787;
		}
		#test-report .test-fail {
			color  : #ff7b72;
		}
		#test-report .test-message {
			margin-left : 12px;
			color       : #ffb86c;
		}
	</style>
